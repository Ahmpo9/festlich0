<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
#loader{position:fixed;inset:0;background:#F8F6F3;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.loader-logo{font-family:sans-serif;font-size:28px;color:#C8A060}
#content{display:none}
#content.show{display:block}
#error{display:none;color:#d00;text-align:center;padding:60px}
#error.show{display:block}
</style>
</head>
<body>
<div id="loader"><div class="loader-logo">Loading...</div></div>
<div id="error"><h2>Error</h2><p id="error-text"></p></div>
<div id="content"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  
  function showContent(html) {
    $('content').innerHTML = html;
    $('content').classList.add('show');
    $('loader').style.opacity = '0';
    setTimeout(() => $('loader').style.display = 'none', 400);
  }
  
  function showError(msg) {
    $('error-text').textContent = msg;
    $('error').classList.add('show');
    $('loader').style.display = 'none';
  }
  
  async function boot() {
    try {
      const SUPA_URL = 'https://odtvcglpxojsyxstmbtq.supabase.co';
      const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kdHZjZ2xweG9qc3l4c3RtYnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTg2MTAsImV4cCI6MjA5MDc5NDYxMH0.HjODTfOS4OAM2z4T3naX2xHzwikgD-r_H1v-wtgd7GM';
      const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
      
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug') || '';
      
      if (!slug) {
        showContent('<h1>Einladung</h1><p>Kein Slug angegeben.</p>');
        return;
      }
      
      const { data, error } = await sb.from('invitations').select('*').eq('slug', slug).single();
      
      if (error || !data) {
        showContent('<h1>Nicht gefunden</h1><p>Slug: ' + slug + '</p>');
        return;
      }
      
      showContent('<h1>' + (data.host_name_1 || '') + ' & ' + (data.host_name_2 || '') + '</h1><p>Datum: ' + (data.event_date || '') + '</p>');
      
    } catch (e) {
      showError('Fehler: ' + e.message);
    }
  }
  
  boot();
})();
</script>
</body>
</html>
