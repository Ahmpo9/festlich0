<style>
/* ════════════════════════════════════════════════════════════
   FESTLICH INVITATION — UNIVERSAL RESET
   ════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Josefin Sans',sans-serif;color:#333;line-height:1.6;overflow-x:hidden;min-height:100svh;background:#F8F6F3}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
input,select,textarea,button{font-family:inherit;font-size:inherit;border:none;outline:none;background:transparent}
button{cursor:pointer;touch-action:manipulation}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:#F8F6F3;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
.loader-logo{font-family:'Great Vibes',cursive;font-size:28px;color:#C8A060}
.loader-bar{width:120px;height:2px;background:rgba(200,160,96,.15);border-radius:2px;overflow:hidden;position:relative}
.loader-bar::after{content:'';position:absolute;left:0;top:0;height:100%;width:30%;background:#C8A060;border-radius:2px;animation:loadSlide 1.2s ease-in-out infinite}
@keyframes loadSlide{0%{left:-30%}100%{left:130%}}

/* ── ERROR STATES ── */
#not-found,#error-msg{display:none;text-align:center;padding:80px 24px}
#not-found.show,#error-msg.show{display:flex;flex-direction:column;align-items:center}
#error-msg{color:#d00}
.state-icon{font-size:48px;margin-bottom:16px}
.state-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:10px}
.state-text{color:#888;font-size:14px;line-height:1.6;max-width:400px}

/* ── INVITATION CONTAINER ── */
#invitation{display:none}
#invitation.show{display:block;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ════════════════════════════════════════════════════════════
   TEMPLATE: BLOSSOM  (font_preset = "blossom" | "flieder")
   Lavendel · Watercolor · Arch Frames · Soft & Romantic
   ════════════════════════════════════════════════════════════ */
.bl-body{background:#F0EBF6}

/* Hero: fresco bg + arch card */
.bl-hero{position:relative;height:440px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bl-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.bl-hero-wash{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(220,210,235,.35) 65%,rgba(240,235,246,.95) 100%)}
.bl-hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,transparent 40%,rgba(220,210,235,.4) 65%,rgba(240,235,246,.95) 100%)}
.bl-arch{position:relative;z-index:3;background:rgba(255,255,255,.97);border-radius:999px 999px 0 0;width:78%;padding:38px 26px 46px;text-align:center;box-shadow:0 -20px 60px rgba(140,120,180,.2)}
.bl-eyebrow{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.4em;text-transform:uppercase;color:#9580B8;display:block;margin-bottom:14px}
.bl-names{font-family:'Great Vibes',cursive;font-size:40px;color:#1E1228;line-height:1.1;margin-bottom:8px}
.bl-amp{font-size:.68em;font-style:italic;color:#9580B8;opacity:.8}
.bl-date{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;color:#9580B8}

/* Couple photo arch */
.bl-couple-wrap{position:relative;background:#F0EBF6;padding:20px 20px 0}
.bl-couple-arch{border-radius:999px 999px 0 0;overflow:hidden;height:360px;position:relative}
.bl-couple-img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.bl-couple-caption{text-align:center;padding:16px 0 20px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:#9580B8}

/* Quote */
.bl-quote-sec{background:#F0EBF6;padding:24px 20px}
.bl-quote-inner{background:white;border-radius:18px;padding:24px 18px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(140,120,180,.1)}
.bl-ql{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.28em;text-transform:uppercase;color:#9580B8;margin-bottom:10px;display:block}
.bl-qmark{position:absolute;top:-8px;left:10px;font-family:'Cormorant Garamond',serif;font-size:100px;color:#E8E0F2;line-height:1;z-index:0}
.bl-qt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#1E1228;line-height:1.7;position:relative;z-index:1}
.bl-qs{font-size:11px;color:#9580B8;margin-top:9px;display:block;position:relative;z-index:1}

/* Calendar */
.bl-cal-sec{position:relative;overflow:hidden;padding:36px 20px;text-align:center}
.bl-cal-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.bl-cal-overlay{position:absolute;inset:0;background:rgba(120,90,170,.15)}
.bl-cal-content{position:relative;z-index:2}
.bl-cal-month{font-family:'Great Vibes',cursive;font-size:32px;color:white;margin-bottom:18px;text-shadow:0 2px 12px rgba(80,50,120,.4)}
.bl-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:210px;margin:0 auto}
.bl-wd{font-size:8px;text-transform:uppercase;color:rgba(255,255,255,.5);text-align:center;padding:3px 0}
.bl-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:300;color:rgba(255,255,255,.75);border-radius:50%}
.bl-day.a{background:white;color:#7A5AB0;font-weight:700;box-shadow:0 0 18px rgba(255,255,255,.5)}
.bl-day.p{opacity:.22}
.bl-cd{display:flex;gap:8px;justify-content:center;margin-top:22px}
.bl-cdb{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:10px;min-width:50px;text-align:center}
.bl-cdn{font-family:'Cormorant Garamond',serif;font-size:26px;color:white;line-height:1;display:block;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.bl-cdl{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);display:block;margin-top:3px}

/* Ceremony */
.bl-cer-sec{background:#F0EBF6;padding:24px 18px}
.bl-cer-card{background:white;border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 4px 20px rgba(140,120,180,.1)}
.bl-cer-ico{font-size:34px;margin-bottom:10px}
.bl-cer-title{font-family:'Great Vibes',cursive;font-size:30px;color:#1E1228;margin-bottom:10px}
.bl-cer-name{font-size:13.5px;font-weight:400;color:#1E1228;margin-bottom:5px}
.bl-cer-time{display:inline-flex;align-items:center;gap:6px;background:#F0EAF8;border-radius:100px;padding:8px 16px;font-size:12.5px;color:#9580B8;margin:9px 0}
.bl-cer-addr{font-size:11.5px;color:#7A6A8A;font-weight:300;line-height:1.65}
.bl-map-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#B098CC,#9580B8);color:white;border:none;border-radius:100px;padding:9px 20px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:12px}

/* Timing */
.bl-timing-sec{background:white;padding:24px 18px;margin:0 18px;border-radius:18px;box-shadow:0 4px 20px rgba(140,120,180,.08);margin-bottom:20px}
.bl-timing-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#1E1228;text-align:center;margin-bottom:14px}
.bl-tr{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(180,160,210,.15)}
.bl-tr:last-child{border:none}
.bl-tt{font-family:'Cinzel',serif;font-size:11px;color:#9580B8;min-width:44px}
.bl-te{font-size:12.5px;color:#3A2A4A;font-weight:300}

/* RSVP */
.bl-rsvp{position:relative;overflow:hidden;padding:36px 20px;text-align:center}
.bl-rsvp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.bl-rsvp-overlay{position:absolute;inset:0;background:rgba(100,70,150,.55)}
.bl-rsvp-content{position:relative;z-index:2}
.bl-rsvp-title{font-family:'Great Vibes',cursive;font-size:38px;color:white;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.bl-rsvp-sub{font-size:11.5px;color:rgba(255,255,255,.75);margin-bottom:20px;line-height:1.6;font-weight:300}
.bl-rf{width:100%;padding:11px 16px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);border-radius:100px;color:white;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.07em;text-transform:uppercase;outline:none;margin-bottom:9px;text-align:center}
.bl-rf::placeholder{color:rgba(255,255,255,.45)}
.bl-rb{width:100%;background:rgba(255,255,255,.92);color:#7A5AB0;border:none;border-radius:100px;padding:12px;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-weight:600}
.bl-radios{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.bl-radio{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.85);cursor:pointer}

/* Footer */
.bl-footer{background:#1E1228;padding:18px;text-align:center}
.bl-fb{font-family:'Great Vibes',cursive;font-size:21px;color:rgba(255,255,255,.3)}
.bl-fb span{color:#C8A060}

/* ════════════════════════════════════════════════════════════
   TEMPLATE: MONO  (font_preset = "mono" | "glanz")
   Schwarz-Weiß · Silhouette · Minimal · Dramatic
   ════════════════════════════════════════════════════════════ */
.mn-body{background:#FAFAFA}

/* Hero: silhouette full-height */

.mn-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:contrast(1.15) brightness(.9)}

/* Quote */
.mn-quote-sec{background:white;padding:28px 22px;position:relative;overflow:hidden}

/* Dark calendar */
.mn-dark{background:#0A0A0A;padding:36px 22px;text-align:center;position:relative;overflow:hidden}
.mn-cal-month{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:white;margin-bottom:18px;position:relative;z-index:1}

.mn-cd{display:flex;gap:16px;justify-content:center;align-items:baseline;margin-top:26px;position:relative;z-index:1}
.mn-cdn{font-family:'Cormorant Garamond',serif;font-size:42px;color:white;line-height:1;letter-spacing:-.01em}
.mn-cdl{font-family:'Josefin Sans',sans-serif;font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);display:block;text-align:center;margin-top:3px}
.mn-sep{font-size:28px;color:rgba(255,255,255,.15);padding-bottom:14px}

/* Ceremony */
.mn-cer-sec{background:white;padding:26px 22px}
.mn-cer-label{font-family:'Josefin Sans',sans-serif;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:#888;margin-bottom:10px;display:block}
.mn-cer-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:#111;margin-bottom:16px}

.mn-cer-val{font-size:14px;color:#111;margin-bottom:1px}
.mn-cer-sub{font-size:12px;color:#666;font-weight:300}

/* Timing */
.mn-timing-sec{background:#F6F6F6;padding:24px 22px}
.mn-timing-label{font-family:'Josefin Sans',sans-serif;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:#888;margin-bottom:10px;display:block}
.mn-timing-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:#111;margin-bottom:14px}
.mn-tr{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #EBEBEB}
.mn-tr:last-child{border:none}
.mn-tt{font-family:'Josefin Sans',sans-serif;font-size:11px;color:#999;min-width:44px;letter-spacing:.06em}

.mn-rsvp-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:34px;color:white;margin-bottom:6px;position:relative;z-index:1}

/* ════════════════════════════════════════════════════════════
   TEMPLATE: AZUR  (font_preset = "azur")
   Split Screen · Türkis · Gold · Luxus · Sonne
   ════════════════════════════════════════════════════════════ */
.az-body{background:#FDFBF7;font-family:'Josefin Sans',sans-serif}

/* Split Hero */

.az-split-img{position:relative;overflow:hidden}
.az-split-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}

.az-split-text{background:#FDFBF7;display:flex;flex-direction:column;justify-content:center;padding:28px 16px 28px 12px}
.az-split-eyebrow{font-family:'Cinzel',serif;font-size:6.5px;letter-spacing:.32em;text-transform:uppercase;color:#B8922A;margin-bottom:12px;display:block}

.az-split-amp{font-style:italic;display:block;font-size:.85em;color:#B8922A;margin:2px 0}

.az-split-line{width:24px;height:1px;background:#B8922A;margin-bottom:14px}
.az-split-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:#5A4A2A;line-height:1.55;font-weight:300}

/* Quote stripe */
.az-quote-stripe{position:relative;overflow:hidden;background:#1A1208;padding:36px 24px;color:white;text-align:center}
.az-qs-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.15}
.az-qs-overlay{position:absolute;inset:0;background:rgba(26,18,8,.82)}
.az-qs-content{position:relative;z-index:2}

.az-qs-src{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;color:rgba(200,160,60,.65)}

.az-sea-section{position:relative;height:200px;overflow:hidden}
.az-sea-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.az-sea-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(26,18,8,.6))}
.az-sea-text{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;text-align:center;color:white}
.az-sea-big{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.8}

.az-cal-strip-m{font-family:'DM Serif Display',serif;font-style:italic;font-size:28px;color:#C8A060}
.az-cal-strip-y{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:rgba(200,160,60,.45)}
.az-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.az-wd{font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center;padding:3px 0}

.az-cd-item{text-align:center;padding:8px 4px;border-right:1px solid rgba(26,18,8,.2)}

/* ── HELPERS ── */
function fmtShort(d){if(!d)return'';const x=new Date(d+'T00:00:00');if(isNaN(x))return d;return x.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}
function fmtLong(d){if(!d)return'';const x=new Date(d+'T00:00:00');if(isNaN(x))return d;return x.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtMonthYear(d){if(!d)return'';const x=new Date(d+'T00:00:00');if(isNaN(x))return'';return{month:x.toLocaleDateString('de-DE',{month:'long'}),year:x.getFullYear()}}
function fmtMonthYearEn(d){if(!d)return'';const x=new Date(d+'T00:00:00');if(isNaN(x))return'';return{month:x.toLocaleDateString('en-GB',{month:'long'}),year:x.getFullYear()}}

function nl2br(s){return s.replace(/\n/g,'<br>')}

/* ── CALENDAR BUILDER ── */
function buildCal(dateStr,clsPre,activeDayId){
  if(!dateStr)return'';
  const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return'';
  const y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const dow=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h='<div class="'+clsPre+'-cal">';
  dow.forEach(day=>{h+='<div class="'+clsPre+'-wd">'+day+'</div>'});
  let f=(first+6)%7;
  for(let i=0;i<f;i++){h+='<div class="'+clsPre+'-day p"></div>'}
  for(let day=1;day<=days;day++){
    const cls=(day===d.getDate())?'a':'', cls2=(day<d.getDate())?' p':'';
    h+='<div class="'+clsPre+'-day'+cls+cls2+'">'+day+'</div>';
  }
  h+='</div>';return h;
}

/* ════════════════════════════════════════════════════════════
   BLOSSOM RENDERER
   ════════════════════════════════════════════════════════════ */
function renderBlossom(d){
  const my=d.event_date?d.event_date.split('-'):['','',''];
  const dt=fmtMonthYear(d.event_date);
  const my2=fmtMonthYearEn(d.event_date);
  const ids=['bl-d','bl-h','bl-m','bl-s'];
  let h='<div class="bl-body">';

  /* HERO */
  h+='<div class="bl-hero">';
  h+='<img class="bl-hero-bg" src="'+(d.hero_image||'')+'" alt="" onerror="this.style.display=\'none\'">';
  h+='<div class="bl-hero-wash"></div><div class="bl-hero-grad"></div>';
  h+='<div class="bl-arch">';
  h+='<span class="bl-eyebrow">Wedding Day</span>';
  h+='<div class="bl-names">'+esc(d.partner1_name)+'<span class="bl-amp"> &amp; </span>'+esc(d.partner2_name)+'</div>';
  h+='<div class="bl-date">'+(my[2]||'')+' &middot; '+(my[1]||'')+' &middot; '+(my[0]||'')+'</div>';
  h+='</div></div>';

  /* COUPLE */
  if(d.couple_image){
    h+='<div class="bl-couple-wrap"><div class="bl-couple-arch">';
    h+='<img class="bl-couple-img" src="'+esc(d.couple_image)+'" alt="">';

  }

  /* QUOTE */
  if(d.love_quote){
    h+='<div class="bl-quote-sec"><div class="bl-quote-inner">';
    h+='<div class="bl-qmark">&ldquo;</div>';
    if(d.quote_author) h+='<span class="bl-ql">'+esc(d.quote_author)+'</span>';
    h+='<div class="bl-qt">'+esc(d.love_quote)+'</div>';
    if(d.quote_author) h+='<span class="bl-qs">&mdash; '+esc(d.quote_author)+'</span>';
    h+='</div></div>';
  }

  /* CALENDAR + COUNTDOWN */
  h+='<div class="bl-cal-sec">';
  h+='<img class="bl-cal-bg" src="'+(d.calendar_bg||'')+'" alt="" onerror="this.style.display=\'none\'">';
  h+='<div class="bl-cal-overlay"></div>';
  h+='<div class="bl-cal-content">';
  h+='<div class="bl-cal-month">'+esc(my2.month||'')+' '+esc(String(my2.year||''))+'</div>';
  h+=buildCal(d.event_date,'bl','bl-cal');
  h+=cdHTML('bl',ids);
  h+='</div></div>';

  /* CEREMONY */

    if(d.event_time) h+='<div class="bl-cer-time">&#128336; '+esc(d.event_time)+' Uhr</div>';
    if(d.ceremony_address) h+='<div class="bl-cer-addr">'+nl2br(esc(d.ceremony_address))+'</div>';
    if(d.map_link) h+='<button class="bl-map-btn" onclick="window.open(\''+esc(d.map_link)+'\',\'_blank\')">&#128205; Maps</button>';
    h+='</div></div>';

/* ════════════════════════════════════════════════════════════
   COUNTDOWN ENGINE
   ════════════════════════════════════════════════════════════ */
let cdTimer=null;
function startCountdown(dateStr,timeStr){
  if(!dateStr)return;
  const target=new Date(dateStr+'T'+(timeStr||'00:00')+':00');
  if(isNaN(target))return;
  const prefix=['bl','mn','az','bh'];
  const ids=[['bl-d','bl-h','bl-m','bl-s'],['mn-d','mn-h','mn-m','mn-s'],['az-d','az-h','az-m','az-s'],['bh-d','bh-h','bh-m','bh-s']];

  function tick(){
    const now=new Date();
    const diff=target-now;
    const days=Math.max(0,Math.floor(diff/864e5));
    const hours=Math.max(0,Math.floor((diff%864e5)/36e5));
    const mins=Math.max(0,Math.floor((diff%36e5)/6e4));
    const secs=Math.max(0,Math.floor((diff%6e4)/1e3));

    ids.forEach(group=>{
      group.forEach((id,i)=>{
        const el=$(id);if(!el)return;
        const val=[days,hours,mins,secs][i];
        el.textContent=String(val).padStart(2,'0');
      });
    });

    if(diff<=0&&cdTimer){clearInterval(cdTimer);cdTimer=null}
  }
  tick();
  if(cdTimer)clearInterval(cdTimer);
  cdTimer=setInterval(tick,1000);
}

/* ════════════════════════════════════════════════════════════
   RSVP HANDLER
   ════════════════════════════════════════════════════════════ */
async function handleRSVP(ev,form,prefix){
  ev.preventDefault();
  const btn=form.querySelector('button[type="submit"]');
  const origText=btn.textContent;
  btn.textContent='Sending...';
  btn.disabled=true;

  const fd=new FormData(form);
  const name=(fd.get('name')||'').trim();
  const phone=(fd.get('phone')||'').trim();
  const guests=parseInt(fd.get('guests')||'0')||0;
  const attending=(fd.get('attending')||'')==='yes';
  const invitationId=form.dataset.id;

  if(!name){alert('Please enter your name');btn.textContent=origText;btn.disabled=false;return}

  try{
    const {error}=await sb.from('rsvps').insert([{
      invitation_id:invitationId,
      guest_name:name,
      email:phone||null,
      adults:guests||1,
      attending:attending,
      message:null
    }]);
    if(error)throw error;
    form.innerHTML='<div style="padding:24px;background:rgba(200,160,96,.15);border-radius:12px;border:1px solid rgba(200,160,96,.25);text-align:center">'+
      '<div style="font-size:32px;margin-bottom:8px">&#10084;</div>'+
      '<div style="font-size:14px;color:#555">Thank you! We received your reply.</div></div>';
  }catch(err){
    console.error('RSVP error:',err);
    alert('Error sending RSVP. Please try again.');
    btn.textContent=origText;
    btn.disabled=false;
  }
}

  };
}

/* ════════════════════════════════════════════════════════════
   DOWNLOAD FUNCTION — exports exact same HTML as rendered
   ════════════════════════════════════════════════════════════ */
function downloadInvitation(){
  const el=$('invitation');
  if(!el||!el.innerHTML.trim()){alert('No invitation to download');return}

  /* Find which template body class is used */
  const bodyDiv=el.querySelector('[class$="-body"]');
  const tmplClass=bodyDiv?bodyDiv.className:'bl-body';

  /* Build standalone HTML with identical CSS */
  let css='';
  const styleSheets=document.styleSheets;
  try{
    for(const ss of styleSheets){
      for(const rule of ss.cssRules||[]){
        css+=rule.cssText+'\n';
      }
    }
  }catch(e){/* CORS */}

  /* Fallback: extract all <style> content */
  if(!css){
    document.querySelectorAll('style').forEach(s=>{css+=s.textContent+'\n'});
  }

  const html='<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="UTF-8">\n'+
    '<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">\n'+
    '<title>Einladung — Festlich</title>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Great+Vibes&family=Cinzel:wght@400;500;600&family=Josefin+Sans:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">\n'+
    '<style>\n'+css+'\n</style>\n</head>\n<body class="'+tmplClass+'">\n'+
    el.innerHTML+'\n'+
    '<script>\n'+document.querySelector('script').textContent+'\n<\/script>\n'+
    '</body>\n</html>';

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='einladung.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
}

/* ════════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════════ */
async function boot(){
  try{
    const path=window.location.pathname;
    const params=new URLSearchParams(window.location.search);
    let slug=params.get('slug');
    if(!slug){
      const m=path.match(/\/e\/([^\/]+)/);
      if(m)slug=m[1];
    }

    /* DEMO MODE — wenn kein Slug da ist, zeige Demo statt Fehler */
    if(!slug){
      showDemo();
      return;
    }

    const data=await fetchInvitation(slug);
    renderInvitation(data);
    $('invitation').classList.add('show');
    startCountdown(data.event_date,data.event_time);
    hideLoader();
  }catch(err){
    console.error('Boot error:',err);
    if(err&&err.code==='PGRST116')showNotFound();
    else showError('Fehler: '+(err&&err.message?err.message:'Unknown'));
  }
}

/* ── UI HELPERS ── */
function hideLoader(){const l=$('loader');if(l){l.style.opacity='0';setTimeout(()=>l.style.display='none',400)}}
function showNotFound(){hideLoader();$('not-found').classList.add('show')}
function showError(msg){hideLoader();$('error-text').textContent=msg;$('error-msg').classList.add('show')}

/* GO */
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
