/* ════════════════════════════════════════════════════════════
   FESTLICH INVITATION v3 — UNIVERSAL RESET
   ════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{font-family:'Josefin Sans',sans-serif;color:#333;line-height:1.6;overflow-x:hidden;min-height:100svh;background:#F8F6F3}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
input,select,textarea,button{font-family:inherit;font-size:inherit;border:none;outline:none;background:transparent}
button{cursor:pointer;touch-action:manipulation}

/* LOADER */
#loader{position:fixed;inset:0;background:#F8F6F3;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
.loader-logo{font-family:'Great Vibes',cursive;font-size:28px;color:#C8A060}
.loader-bar{width:120px;height:2px;background:rgba(200,160,96,.15);border-radius:2px;overflow:hidden;position:relative}
.loader-bar::after{content:'';position:absolute;left:0;top:0;height:100%;width:30%;background:#C8A060;border-radius:2px;animation:loadSlide 1.2s ease-in-out infinite}
@keyframes loadSlide{0%{left:-30%}100%{left:130%}}

/* ERROR STATES */
#not-found,#error-msg{display:none;text-align:center;padding:80px 24px}
#not-found.show,#error-msg.show{display:flex;flex-direction:column;align-items:center}
.state-icon{font-size:48px;margin-bottom:16px}
.state-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:10px}
.state-text{color:#888;font-size:14px;line-height:1.6;max-width:400px}

/* INVITATION CONTAINER */
#invitation{display:none}
#invitation.show{display:block;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ════════════════════════════════════════════════════════════
   RSVP SHARED (used in all templates)
   ════════════════════════════════════════════════════════════ */

.rsvp-success.show{display:block}
.rsvp-success-ico{font-size:40px;margin-bottom:10px}
.rsvp-success-ttl{font-family:'Cormorant Garamond',serif;font-size:22px;margin-bottom:6px}
.rsvp-success-sub{font-size:13px;opacity:.6;font-weight:300}

.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.menu-btn{border-radius:8px;padding:9px 10px;font-size:11.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;letter-spacing:.04em;transition:all .18s;border:1.5px solid transparent}

/* ── HELPERS ── */
const $=id=>document.getElementById(id)
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const nl2br=s=>String(s||'').replace(/\n/g,'<br>')
function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');if(isNaN(x))return d;return x.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})}
function fmtMonthYear(d){if(!d)return{month:'',year:''};const x=new Date(d+'T00:00:00');if(isNaN(x))return{month:'',year:''};return{month:x.toLocaleDateString('de-DE',{month:'long'}),year:x.getFullYear()}}

/* ── CALENDAR ── */
function buildCal(dateStr,clsPre){
  if(!dateStr)return''
  const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return''
  const y=d.getFullYear(),m=d.getMonth()
  const first=new Date(y,m,1).getDay()
  const days=new Date(y,m+1,0).getDate()
  const dow=['Mo','Di','Mi','Do','Fr','Sa','So']
  let h=`<div class="${clsPre}-cal">`
  dow.forEach(day=>{h+=`<div class="${clsPre}-wd">${day}</div>`})
  let f=(first+6)%7
  for(let i=0;i<f;i++){h+=`<div class="${clsPre}-day p"></div>`}
  for(let day=1;day<=days;day++){
    const isAct=day===d.getDate(),isPast=day<d.getDate()
    h+=`<div class="${clsPre}-day${isAct?' a':''}${isPast?' p':''}">${day}</div>`
  }
  h+='</div>';return h
}

/* ── COUNTDOWN ── */
let cdTargetDate=null,cdInterval=null
function startCountdown(dateStr,timeStr){
  if(!dateStr)return
  const t=timeStr||'12:00'
  cdTargetDate=new Date(`${dateStr}T${t}:00`)
  if(isNaN(cdTargetDate))return
  function tick(){
    const now=new Date(),diff=cdTargetDate-now
    if(diff<=0){clearInterval(cdInterval);return}
    const days=Math.floor(diff/86400000)
    const hrs=Math.floor((diff%86400000)/3600000)
    const mins=Math.floor((diff%3600000)/60000)
    const secs=Math.floor((diff%60000)/1000)
    document.querySelectorAll('.cd-days').forEach(el=>el.textContent=days)
    document.querySelectorAll('.cd-hrs').forEach(el=>el.textContent=String(hrs).padStart(2,'0'))
    document.querySelectorAll('.cd-mins').forEach(el=>el.textContent=String(mins).padStart(2,'0'))
    document.querySelectorAll('.cd-secs').forEach(el=>el.textContent=String(secs).padStart(2,'0'))
  }
  tick();cdInterval=setInterval(tick,1000)
}

/* ── IMG STYLE with position ── */
function imgStyle(posX,posY,scale){
  const x=posX||50,y=posY||50,s=scale||1
  return `object-fit:cover;object-position:${x}% ${y}%;transform:scale(${s});transform-origin:center`
}

/* ── GALLERY HTML ── */
function galleryHTML(gallery){
  if(!gallery||!gallery.length)return''
  const items=gallery.filter(g=>g.role==='gallery'&&g.url)
  if(!items.length)return''
  let h='<div class="gallery-grid">'
  items.forEach((g,i)=>{
    const wide=i===0&&items.length>=3
    h+=`<div class="gallery-item${wide?' wide':''}">
      <img src="${esc(g.url)}" style="${imgStyle(g.pos_x,g.pos_y,g.scale)}" loading="lazy" alt="Foto">
    </div>`
  })
  h+='</div>';return h
}

/* ── RSVP FORM ── */
function rsvpFormHTML(inv,pfx,inputClass,btnClass,menuBtnClass,radioTextColor){
  const menuEnabled=inv.menu_enabled!==false
  const opts=[]
  if(inv.menu_meat_enabled!==false)opts.push({k:'meat',ico:'🥩',l:'Fleisch'})
  if(inv.menu_fish_enabled!==false)opts.push({k:'fish',ico:'🐟',l:'Fisch'})
  if(inv.menu_vegetarian_enabled!==false)opts.push({k:'vegetarian',ico:'🥗',l:'Vegetarisch'})
  if(inv.menu_vegan_enabled!==false)opts.push({k:'vegan',ico:'🌱',l:'Vegan'})

  return`
  <div id="${pfx}-rsvp-form">
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:${radioTextColor};cursor:pointer">
        <input type="radio" name="${pfx}-attending" value="yes" checked style="accent-color:#C8A060"> Ich komme
      </label>
      <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:${radioTextColor};cursor:pointer">
        <input type="radio" name="${pfx}-attending" value="no" style="accent-color:#C8A060"> Leider nicht
      </label>
    </div>
    <input class="${inputClass}" id="${pfx}-name" placeholder="Dein Name *" required>
    <input class="${inputClass}" id="${pfx}-email" placeholder="E-Mail (optional)" type="email">
    <input class="${inputClass}" id="${pfx}-count" placeholder="Anzahl Personen" type="number" min="1" max="${inv.rsvp_max_guests||10}" value="1" style="text-align:center">
    ${menuEnabled&&opts.length?`
    <div id="${pfx}-menu-wrap" style="margin-bottom:9px">
      <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${radioTextColor};opacity:.7;margin-bottom:7px">🍽️ Menü-Auswahl</div>
      <div class="menu-row">
        ${opts.map(o=>`<button type="button" class="menu-btn ${menuBtnClass}" data-meal="${o.k}" onclick="selectMenu(this,'${pfx}')">
          <span>${o.ico}</span><span>${o.l}</span>
        </button>`).join('')}
      </div>
    </div>`:''}
    <textarea class="${inputClass}" id="${pfx}-msg" placeholder="Nachricht (optional)" style="resize:none;min-height:60px;border-radius:8px;padding:10px 14px;margin-bottom:9px"></textarea>
    ${inv.rsvp_deadline?`<div style="font-size:10.5px;color:${radioTextColor};opacity:.55;margin-bottom:10px">Bitte bis ${fmtDate(inv.rsvp_deadline)} antworten</div>`:''}
    <button class="${btnClass}" onclick="submitRSVP('${pfx}','${inv.id}')">RSVP Absenden</button>
    <div id="${pfx}-rsvp-msg" style="margin-top:10px;font-size:12px;text-align:center"></div>
  </div>
  <div class="rsvp-success" id="${pfx}-rsvp-success">
    <div class="rsvp-success-ico">🎉</div>
    <div class="rsvp-success-ttl" style="color:${radioTextColor}">Vielen Dank!</div>
    <div class="rsvp-success-sub" style="color:${radioTextColor}">Deine Antwort wurde gespeichert.</div>
  </div>`
}

function selectMenu(btn,pfx){
  const wrap=document.getElementById(`${pfx}-menu-wrap`)
  if(!wrap)return
  wrap.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('sel'))
  btn.classList.add('sel')
}

async function submitRSVP(pfx,invId){
  const nameEl=$(`${pfx}-name`)
  if(!nameEl||!nameEl.value.trim()){
    const msg=$(`${pfx}-rsvp-msg`)
    if(msg){msg.textContent='Bitte Namen eingeben.';msg.style.color='#f87171'}
    return
  }
  const attending=document.querySelector(`input[name="${pfx}-attending"]:checked`)?.value!=='no'
  const selMenu=document.querySelector(`#${pfx}-menu-wrap .menu-btn.sel`)?.dataset.meal||'none'
  const payload={
    invitation_id:invId,
    guest_name:nameEl.value.trim(),
    guest_email:$(`${pfx}-email`)?.value.trim()||'',
    attending,
    guest_count:parseInt($(`${pfx}-count`)?.value||1),
    meal_preference:attending?selMenu:'none',
    message:$(`${pfx}-msg`)?.value.trim()||'',
  }
  const btn=document.querySelector(`#${pfx}-rsvp-form button[onclick]`)
  if(btn){btn.disabled=true;btn.textContent='Wird gesendet…'}
  const{error}=await sb.from('rsvps').insert(payload)
  if(error){
    const msg=$(`${pfx}-rsvp-msg`)
    if(msg){msg.textContent='Fehler: '+error.message;msg.style.color='#f87171'}
    if(btn){btn.disabled=false;btn.textContent='RSVP Absenden'}
    return
  }
  $(`${pfx}-rsvp-form`).style.display='none'
  const suc=$(`${pfx}-rsvp-success`);if(suc)suc.classList.add('show')
  // Increment view count
  await sb.rpc('increment_view',{inv_id:invId}).catch(()=>{})
}

  return`<div class="bl-body">

  <div class="bl-hero">

    ${d.reception_time_str?`<div class="bh-cer-row"><div class="bh-cer-ico-sm">🕐</div><div><div class="bh-cer-lbl">Uhrzeit</div><div class="bh-cer-val">${esc(d.reception_time_str)}</div></div></div>`:''}
    ${d.reception_map_url?`<a href="${esc(d.reception_map_url)}" target="_blank" class="bh-map-btn">📍 Route anzeigen</a>`:''}
  </div></div>`:''}

  ${d.timeline_json&&d.timeline_json.length?`<div class="bh-timing-sec">
    <span class="bh-timing-eyebrow">Ablauf</span>
    <div class="bh-timing-title">Unser Tagesplan</div>
    ${d.timeline_json.map(t=>`<div class="bh-tr"><span class="bh-tt">${esc(t.time||'')}</span><span class="bh-te">${esc(t.title||'')}</span></div>`).join('')}
  </div>`:''}

  <div class="bh-rsvp-sec">
    <span class="bh-rsvp-eyebrow">Sagst du uns Bescheid?</span>
    <div class="bh-rsvp-title">RSVP</div>
    <div class="bh-rsvp-sub">${d.rsvp_note?esc(d.rsvp_note):'Wir freuen uns auf deine Rückmeldung.'}</div>
    ${rsvpFormHTML(d,'bh','bh-rf','bh-rb','bh-menu-btn','rgba(255,255,255,.8)')}
  </div>
  <div class="bh-footer"><div class="bh-fb">Festlich<span>.</span></div></div>
</div>`
}

/* ════════════════════════════════════════════════════════════
   RENDER DISPATCHER
════════════════════════════════════════════════════════════ */
function renderInvitation(inv,gallery){
  const tpl=inv.font_preset||'blossom'
  let html=''
  if(tpl==='mono')       html=renderMono(inv,gallery)
  else if(tpl==='azur')  html=renderAzur(inv,gallery)
  else if(tpl==='boho')  html=renderBoho(inv,gallery)
  else                   html=renderBlossom(inv,gallery)
  $('invitation').innerHTML=html
}

/* ════════════════════════════════════════════════════════════
   DATA FETCH
════════════════════════════════════════════════════════════ */
async function fetchAndRender(slug){
  const{data:inv,error}=await sb.from('invitations').select('*').eq('slug',slug).single()
  if(error||!inv) throw error||new Error('Not found')

  const{data:gal}=await sb.from('gallery_items').select('*').eq('invitation_id',inv.id).order('sort_order',{ascending:true})

  renderInvitation(inv,gal||[])
  $('invitation').classList.add('show')
  startCountdown(inv.event_date,inv.event_time)

  // Increment view count (fire and forget)
  sb.from('invitations').update({view_count:(inv.view_count||0)+1}).eq('id',inv.id).then(()=>{})
}

/* ── BOOT ── */
function hideLoader(){const l=$('loader');if(l){l.style.opacity='0';setTimeout(()=>l.style.display='none',400)}}
function showNotFound(){hideLoader();$('not-found').classList.add('show')}
function showError(msg){hideLoader();$('error-text').textContent=msg;$('error-msg').classList.add('show')}

async function boot(){
  try{
    const params=new URLSearchParams(window.location.search)
    let slug=params.get('slug')
    if(!slug){
      const m=window.location.pathname.match(/\/e\/([^/]+)/)
      if(m)slug=m[1]
    }
    if(!slug){showDemo();hideLoader();return}
    await fetchAndRender(slug)
    hideLoader()
  }catch(err){
    console.error('Boot error:',err)
    if(err?.code==='PGRST116')showNotFound()
    else showError('Fehler: '+(err?.message||'Unbekannt'))
  }
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot)
else boot()
</script>
