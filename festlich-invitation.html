<html lang="de">
<head>
<meta charset="UTF-8">

<style>
/* RESET & BASE */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Josefin Sans',sans-serif;background:#F8F6F3;color:#333;line-height:1.6;overflow-x:hidden;min-height:100svh}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
input,select,textarea,button{font-family:inherit;font-size:inherit;border:none;outline:none;background:transparent}
button{cursor:pointer;touch-action:manipulation}

/* LOADER */
#loader{position:fixed;inset:0;background:#F8F6F3;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
.loader-logo{font-family:'Great Vibes',cursive;font-size:28px;color:#C8A060}
.loader-bar{width:120px;height:2px;background:rgba(200,160,96,.15);border-radius:2px;overflow:hidden;position:relative}
.loader-bar::after{content:'';position:absolute;left:0;top:0;height:100%;width:30%;background:#C8A060;border-radius:2px;animation:loadSlide 1.2s ease-in-out infinite}
@keyframes loadSlide{0%{left:-30%}100%{left:130%}}

/* ERROR / NOT FOUND STATES */
#not-found,#error-msg{display:none;text-align:center;padding:80px 24px}
#not-found.show,#error-msg.show{display:flex;flex-direction:column;align-items:center}
#error-msg{color:#d00}
.state-icon{font-size:48px;margin-bottom:16px}
.state-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:10px}
.state-text{color:#888;font-size:14px;line-height:1.6;max-width:400px}

/* INVITATION */
#invitation{display:none;opacity:0;transition:opacity .6s}
#invitation.show{display:block;opacity:1}

/* HERO - blossom/flieder */
.hero-blossom{text-align:center;padding:60px 24px 40px;background:#F8F6F3;position:relative;overflow:hidden}
.hero-blossom .save-date{font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#C8A060;margin-bottom:16px}
.hero-blossom .names{font-family:'Great Vibes',cursive;font-size:64px;color:#333;line-height:1.1;margin-bottom:20px}
.hero-blossom .ampersand{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px;color:#C8A060;margin:8px 0}
.hero-blossom .tagline{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-top:16px}
.hero-blossom .heart-divider{width:40px;height:1px;background:#C8A060;margin:24px auto;position:relative}
.hero-blossom .heart-divider::after{content:'\2665';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#C8A060;font-size:12px;background:#F8F6F3;padding:0 8px}

/* HERO - mono/glanz */
.hero-mono{text-align:center;padding:80px 24px 50px;background:#0a0a0a;color:#f5f5f5}
.hero-mono .save-date{font-family:'Josefin Sans',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#bfa06a;margin-bottom:20px}
.hero-mono .names{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;letter-spacing:6px;text-transform:uppercase;line-height:1.2;margin-bottom:12px}
.hero-mono .ampersand{font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:#bfa06a;margin:8px 0;display:block}
.hero-mono .tagline{font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#777;margin-top:20px}
.hero-mono .divider{width:60px;height:1px;background:#bfa06a;margin:28px auto}

/* HERO - boho */
.hero-boho{text-align:center;padding:70px 24px 45px;background:#F5F0E8}
.hero-boho .save-date{font-family:'Josefin Sans',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#8B7355;margin-bottom:18px}
.hero-boho .names{font-family:'Sacramento',cursive;font-size:68px;color:#5C4A3A;line-height:1.1;margin-bottom:12px}
.hero-boho .ampersand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#A08B6D;margin:6px 0;display:block}
.hero-boho .tagline{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-top:18px}
.hero-boho .divider{width:50px;height:1px;background:#C4B49A;margin:24px auto}

/* HERO - azur */
.hero-azur{text-align:center;padding:80px 24px 50px;background:#E8EEF4}
.hero-azur .save-date{font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#5A7A96;margin-bottom:18px}
.hero-azur .names{font-family:'Playfair Display',serif;font-size:48px;color:#2C3E50;line-height:1.2;margin-bottom:12px}
.hero-azur .ampersand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#5A7A96;margin:6px 0;display:block}
.hero-azur .tagline{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7A8A9A;margin-top:18px}
.hero-azur .divider{width:50px;height:1px;background:#5A7A96;margin:24px auto}

/* QUOTE */
.quote-section{padding:50px 24px;text-align:center;max-width:640px;margin:0 auto}
.quote-section .quote-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#555;line-height:1.6;margin-bottom:12px}
.quote-section .quote-source{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#999}

/* CALENDAR + COUNTDOWN */
.cal-countdown{padding:50px 24px;text-align:center;max-width:480px;margin:0 auto}
.cal-countdown .cal-title{font-family:'Great Vibes',cursive;font-size:28px;margin-bottom:8px}
.cal-countdown .cal-date{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:20px}
.calendar-table{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:13px}
.calendar-table th{padding:8px;font-weight:500;color:#aaa;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.calendar-table td{padding:10px 8px;color:#555}
.calendar-table td.today{background:#C8A060;color:#fff;border-radius:50%;font-weight:600;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.calendar-table td.other-month{color:#ccc}
.countdown-box{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.countdown-item{text-align:center;min-width:60px}
.countdown-item .num{font-family:'Playfair Display',serif;font-size:32px;color:#333;display:block;line-height:1}
.countdown-item .label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-top:4px}

/* GALLERY */
.gallery-section{padding:40px 24px}
.gallery-section .gal-title{font-family:'Great Vibes',cursive;font-size:28px;text-align:center;margin-bottom:24px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;max-width:700px;margin:0 auto}
.gallery-grid img{width:100%;height:180px;object-fit:cover;border-radius:8px}

/* CEREMONY */
.ceremony-section{padding:50px 24px;text-align:center;max-width:500px;margin:0 auto}
.ceremony-section .cer-title{font-family:'Great Vibes',cursive;font-size:28px;margin-bottom:20px}
.ceremony-section .cer-block{margin-bottom:28px}
.ceremony-section .cer-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:6px}
.ceremony-section .cer-value{font-family:'Playfair Display',serif;font-size:18px;color:#444;line-height:1.5}
.ceremony-section .cer-time{font-size:13px;color:#888;margin-top:4px}

/* TIMELINE */
.timeline-section{padding:50px 24px;max-width:500px;margin:0 auto}
.timeline-section .tl-title{font-family:'Great Vibes',cursive;font-size:28px;text-align:center;margin-bottom:32px}
.timeline-item{display:flex;gap:16px;margin-bottom:24px;align-items:flex-start}
.timeline-item .tl-dot{flex-shrink:0;width:10px;height:10px;border-radius:50%;background:#C8A060;margin-top:6px}
.timeline-item .tl-time{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#aaa;margin-bottom:2px}
.timeline-item .tl-event{font-family:'Playfair Display',serif;font-size:16px;color:#444}
.timeline-item .tl-desc{font-size:12px;color:#888;margin-top:2px}

/* WELCOME */
.welcome-section{padding:50px 24px;text-align:center;max-width:600px;margin:0 auto}
.welcome-section .wl-title{font-family:'Great Vibes',cursive;font-size:28px;margin-bottom:12px}
.welcome-section .wl-text{font-size:14px;color:#666;line-height:1.8}

/* RSVP */
.rsvp-section{padding:50px 24px;text-align:center}
.rsvp-section .rsvp-title{font-family:'Great Vibes',cursive;font-size:32px;margin-bottom:8px}
.rsvp-section .rsvp-sub{font-size:13px;color:#666;margin-bottom:24px;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto}
.rsvp-form{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:0 8px}
.rsvp-form input,.rsvp-form select,.rsvp-form textarea{
  background:rgba(0,0,0,.05);border:1.5px solid rgba(0,0,0,.08);border-radius:10px;
  padding:14px 16px;color:inherit;width:100%;font-size:16px;-webkit-appearance:none;appearance:none
}
.rsvp-form input:focus,.rsvp-form select:focus,.rsvp-form textarea:focus{border-color:#C8A060}
.rsvp-form textarea{min-height:80px;resize:vertical}
.rsvp-btn{
  background:#C8A060;color:#fff;border-radius:10px;padding:14px 24px;font-size:14px;
  font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-top:4px;transition:background .2s
}
.rsvp-btn:active{background:#a08040}
.rsvp-success{display:none;padding:24px;background:rgba(200,160,96,.08);border-radius:12px;border:1px solid rgba(200,160,96,.2);margin-top:12px}
.rsvp-success.show{display:block}
.rsvp-success .s-icon{font-size:32px;margin-bottom:8px}
.rsvp-success .s-text{font-size:14px;color:#555}

/* FOOTER */
.footer-section{text-align:center;padding:30px 24px;font-size:11px;color:#aaa;letter-spacing:1px}
.dark-footer{background:#0a0a0a;color:#555}

/* MOBILE FIXES */
@media(max-width:400px){
  .hero-blossom .names,.hero-boho .names{font-size:48px}
  .hero-mono .names{font-size:38px;letter-spacing:3px}
  .hero-azur .names{font-size:36px}
  .gallery-grid{grid-template-columns:1fr 1fr}
  .gallery-grid img{height:140px}
  .countdown-item{min-width:50px}
  .countdown-item .num{font-size:26px}
}
@media(max-width:360px){
  .rsvp-form{padding:0}
  .hero-blossom,.hero-boho,.hero-azur{padding-left:16px;padding-right:16px}
  .hero-mono{padding-left:16px;padding-right:16px}
}
</style>
</head>

/* ---- helpers ---- */
function fmtShort(d){
  if(!d) return '';
  const x = new Date(d+'T00:00:00');
  if(isNaN(x)) return d;
  return x.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
}
function fmtLong(d){
  if(!d) return '';
  const x = new Date(d+'T00:00:00');
  if(isNaN(x)) return d;
  return x.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function $(id){ return document.getElementById(id); }

/* ---- calendar builder ---- */
function buildCal(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  const y=d.getFullYear(), m=d.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const dow=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h='<table class="calendar-table"><thead><tr>';
  dow.forEach(day=>h+='<th>'+day+'</th>');
  h+='</tr></thead><tbody><tr>';
  let f=(first+6)%7;
  for(let i=0;i<f;i++) h+='<td class="other-month"></td>';
  for(let day=1;day<=days;day++){
    const cls=(day===d.getDate())?' class="today"':'';
    h+='<td'+cls+'>'+day+'</td>';
    if((f+day-1)%7===6 && day!==days) h+='</tr><tr>';
  }
  const lastPos=(f+days-1)%7;
  for(let i=lastPos;i<6;i++) h+='<td class="other-month"></td>';
  h+='</tr></tbody></table>';
  return h;
}

function renderHeroBoho(d){
  return '<div class="hero-boho">'+

    '<div class="names">'+esc(d.partner1_name)+'<span class="ampersand">&amp;</span>'+esc(d.partner2_name)+'</div>'+

/* ---- HERO: azur ---- */
function renderHeroAzur(d){

/* ---- QUOTE ---- */
function renderQuote(d){
  if(!d.love_quote) return '';
  return '<div class="quote-section">'+
    '<div class="quote-text">&ldquo;'+esc(d.love_quote)+'&rdquo;</div>'+
    '<div class="quote-source">'+esc(d.quote_author||'')+'</div>'+

/* ---- CALENDAR + COUNTDOWN ---- */
function renderCalendarCountdown(d){
  return '<div class="cal-countdown">'+
    '<div class="cal-title">Wir heiraten</div>'+
    '<div class="cal-date">'+esc(fmtLong(d.event_date))+' &bull; '+esc(d.event_time||'')+' Uhr</div>'+
    buildCal(d.event_date)+
    '<div class="countdown-box" id="countdown-box">'+
    '<div class="countdown-item"><span class="num" id="cd-days">00</span><div class="label">Tage</div></div>'+
    '<div class="countdown-item"><span class="num" id="cd-hours">00</span><div class="label">Std</div></div>'+
    '<div class="countdown-item"><span class="num" id="cd-mins">00</span><div class="label">Min</div></div>'+
    '<div class="countdown-item"><span class="num" id="cd-secs">00</span><div class="label">Sek</div></div>'+
    '</div></div>';

/* ---- GALLERY ---- */
function renderGallery(d){
  const imgs=d._gallery||[];
  if(!Array.isArray(imgs)||!imgs.length) return '';
  let h='<div class="gallery-section"><div class="gal-title">Unsere Momente</div><div class="gallery-grid">';
  imgs.forEach(u=>{ if(u) h+='<img src="'+esc(u)+'" alt="Foto" loading="lazy">'; });
  h+='</div></div>';
  return h;
}

/* ---- CEREMONY ---- */
function renderCeremony(d){
  const loc=d.ceremony_location, addr=d.ceremony_address;
  if(!loc&&!addr) return '';
  let h='<div class="ceremony-section"><div class="cer-title">Zeremonie</div>';
  if(loc) h+='<div class="cer-block"><div class="cer-label">Ort</div><div class="cer-value">'+esc(loc)+'</div></div>';
  if(addr) h+='<div class="cer-block"><div class="cer-label">Adresse</div><div class="cer-value">'+nl2br(esc(addr))+'</div></div>';
  if(d.event_time) h+='<div class="cer-block"><div class="cer-label">Uhrzeit</div><div class="cer-time">'+esc(d.event_time)+' Uhr</div></div>';
  h+='</div>';
  return h;
}

/* ---- TIMELINE ---- */
function renderTimeline(d){
  let items=[];
  try{ items=JSON.parse(d.timeline||'[]'); }catch(e){}
  if(!Array.isArray(items)||!items.length) return '';
  let h='<div class="timeline-section"><div class="tl-title">Ablauf</div>';
  items.forEach(t=>{
    h+='<div class="timeline-item">'+
      '<div class="tl-dot"></div>'+
      '<div><div class="tl-time">'+esc(t.time||'')+'</div>'+
      '<div class="tl-event">'+esc(t.event||'')+'</div>';
    if(t.description) h+='<div class="tl-desc">'+esc(t.description)+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

function renderRSVP(d){

/* ---- MAIN RENDERER ---- */
function renderInvitation(d){
  const tmpl=d.template||'blossom';
  let html='';

  /* Hero */
  if(tmpl==='mono'||tmpl==='glanz') html+=renderHeroMono(d);
  else if(tmpl==='boho') html+=renderHeroBoho(d);
  else if(tmpl==='azur') html+=renderHeroAzur(d);
  else html+=renderHeroBlossom(d);

  html+=renderQuote(d);
  html+=renderCalendarCountdown(d);
  html+=renderGallery(d);
  html+=renderCeremony(d);
  html+=renderTimeline(d);
  html+=renderWelcome(d);
  html+=renderRSVP(d);
  html+=renderFooter(d);

  $('invitation').innerHTML=html;
}

/* ---- ESCAPE ---- */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(s){ return s.replace(/\n/g,'<br>'); }

/* ================================================================
   COUNTDOWN
   ================================================================ */
let cdInterval=null;
function startCountdown(dateStr,timeStr){
  if(!dateStr) return;
  const target=new Date(dateStr+'T'+(timeStr||'00:00')+':00');
  if(isNaN(target)) return;

  function tick(){
    const now=new Date();
    const diff=target-now;
    if(diff<=0){
      if($('cd-days')) $('cd-days').textContent='00';
      if($('cd-hours')) $('cd-hours').textContent='00';
      if($('cd-mins')) $('cd-mins').textContent='00';
      if($('cd-secs')) $('cd-secs').textContent='00';
      if(cdInterval) clearInterval(cdInterval);
      return;
    }
    const days=Math.floor(diff/864e5);
    const hours=Math.floor((diff%864e5)/36e5);
    const mins=Math.floor((diff%36e5)/6e4);
    const secs=Math.floor((diff%6e4)/1e3);
    if($('cd-days')) $('cd-days').textContent=String(days).padStart(2,'0');
    if($('cd-hours')) $('cd-hours').textContent=String(hours).padStart(2,'0');
    if($('cd-mins')) $('cd-mins').textContent=String(mins).padStart(2,'0');
    if($('cd-secs')) $('cd-secs').textContent=String(secs).padStart(2,'0');
  }
  tick();
  cdInterval=setInterval(tick,1000);
}

/* ================================================================
   RSVP HANDLER
   ================================================================ */
function handleRSVP(){
  const form=$('rsvp-form');
  if(!form) return;
  form.addEventListener('submit',async function(ev){
    ev.preventDefault();
    const btn=$('rsvp-btn');
    const name=$('rsvp-name').value.trim();
    const email=$('rsvp-email').value.trim();
    const guests=parseInt($('rsvp-guests').value)||0;
    const status=$('rsvp-status').value;
    const message=$('rsvp-message').value.trim();
    const invitationId=form.dataset.id;

    if(!name||!status||!guests){ alert('Bitte fülle alle Pflichtfelder aus.'); return; }

    btn.textContent='Wird gesendet...';
    btn.disabled=true;

    try{
      const {error}=await sb.from('rsvps').insert([{
        invitation_id:invitationId,
        guest_name:name,
        email:email||null,
        adults:guests,
        attending:status==='accepted',
        message:message||null
      }]);
      if(error) throw error;
      form.style.display='none';
      $('rsvp-success').classList.add('show');
    }catch(err){
      console.error('RSVP error:',err);
      alert('Fehler beim Senden. Bitte versuche es erneut.');
      btn.textContent='Absenden';
      btn.disabled=false;
    }
  });
}

/* ================================================================
   DATA FETCHER - korrektes Schema
   ================================================================ */
async function fetchInvitation(slug){
  /* 1. Fetch invitation */
  const {data:inv,error:err1}=await sb.from('invitations')
    .select('*')
    .eq('slug',slug)
    .single();
  if(err1 || !inv) throw err1 || new Error('Not found');

  /* 2. Fetch gallery images */
  const {data:gal}=await sb.from('gallery')
    .select('url')
    .eq('invitation_id',inv.id)
    .order('sort_order',{ascending:true});

  /* 3. Normalize data for renderer */
  const d={
    id:                    inv.id,
    template:              inv.font_preset || 'blossom',
    partner1_name:         inv.host_name_1 || '',
    partner2_name:         inv.host_name_2 || '',
    event_date:            inv.event_date || '',
    event_time:            inv.event_time || '',
    love_quote:            inv.quote_text || '',
    quote_author:          inv.quote_source || '',
    ceremony_location:     inv.ceremony_venue_name || '',
    ceremony_address:      inv.ceremony_address || '',
    welcome_text:          inv.welcome_note || '',
    rsvp_deadline:         inv.rsvp_deadline || '',
    timeline:              inv.timeline_json ? JSON.stringify(inv.timeline_json) : '[]',
    _gallery:              (gal||[]).map(g=>g.url).filter(Boolean)
  };

  return d;
}

/* ================================================================
   BOOT SEQUENCE
   ================================================================ */
async function boot(){
  try{
    /* slug from URL: only /e/SLUG or ?slug= */
    const path=window.location.pathname;
    const params=new URLSearchParams(window.location.search);
    let slug=params.get('slug');
    if(!slug){
      const m=path.match(/\/e\/([^\/]+)/);
      if(m) slug=m[1];
    }

    /* Demo mode when opening invitation.html directly */
    if(path.includes('festlich-invitation') && !slug){
      showDemo();
      return;
    }
    if(!slug){
      showError('Keine Einladung angegeben. Bitte verwende den vollst&auml;ndigen Link.');
      return;
    }

    /* fetch invitation with correct schema */
    const data=await fetchInvitation(slug);

    /* render */
    renderInvitation(data);
    $('invitation').classList.add('show');

    /* start countdown */
    startCountdown(data.event_date,data.event_time);

    /* attach RSVP */
    handleRSVP();

    /* hide loader */
    hideLoader();

  }catch(err){
    console.error('Boot error:',err);
    if(err && err.code==='PGRST116'){
      showNotFound();
    }else{
      showError('Ein unerwarteter Fehler ist aufgetreten. Code: '+(err&&err.code?err.code:'unknown'));
    }
  }
}

/* ---- DEMO MODE (no slug) ---- */

  const demo={

    event_date:'2026-08-15', event_time:'14:00',
    love_quote:'Liebe ist nicht das, was man erwartet zu bekommen, sondern das, was man bereit ist zu geben.',
    quote_author:'Katharine Hepburn',
    ceremony_location:'Schloss Lichtenstein', ceremony_address:'Schlossweg 1\n72805 Lichtenstein',
    welcome_text:'Wir freuen uns darauf, diesen besonderen Tag mit euch zu feiern!',
    rsvp_deadline:'2026-06-15', timeline:'[]', _gallery:[]
  };
  renderInvitation(demo);
  $('invitation').classList.add('show');
  startCountdown(demo.event_date,demo.event_time);
  hideLoader();
}

/* ---- UI HELPERS ---- */
function hideLoader(){
  const l=$('loader');
  if(!l) return;
  l.style.opacity='0';
  setTimeout(function(){ l.style.display='none'; },400);
}
function showNotFound(){
  hideLoader();
  $('not-found').classList.add('show');
}
function showError(msg){
  hideLoader();
  $('error-text').textContent=msg;
  $('error-msg').classList.add('show');
}

/* ---- GO ---- */
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}
